<!DOCTYPE html>
<html>
  <head>
    <title>practice</title>
    <style>
    body{
      background-color: #eeeeee;
    }
    
    .container{
      background-color: white;
      box-shadow: 2px 4px 9px gray;
      padding: 10px;
      height: 300px;
      border-radius: 20px;
      margin-top: 150px;
    }
    
    
      input{
        padding: 16px;
        width: 260px;
        box-shadow: 0px 3px 8px gray;
        border: none;
        border-radius: 20px;
        margin-top: 45px;
        margin-left: 14px;
      }
      
      input:hover{
       outline: 1px solid #4facfe;
      }
      
      h2{
        text-align: center;
        font-size: 25px;
        font-family: Times New Roman;
        color:#000000 ;
      }
      
      button{
        margin-top: 17px;
        margin-left: 110px;
        padding: 10px 30px 10px 30px;
        background-color: green;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        outline: none;
      }
      
      
      #display{
        font-size: 18px;
        text-align: center;
        color: #1a0492;
        font-weight: bold;
      }
      
      
    </style>
  </head>
  <body>
    <div class="container">
   <h2>Check All ODD And EVEN Numbers</h2>
   <input type="number" id="numberinput" placeholder="Enter a Number" onclick="checkNumber()">
    <button onclick="btn()">Check</button>
    <p id="display"></p>
      </div>
  </body>
  <script>
    
      function btn(){
        
    let number = document.getElementById('numberinput').value; 
    
    if ( number === '' ){
      document.getElementById('display').innerHTML =  'Please Enter a Number';
    } else if( number % 2 === 0){
      document.getElementById('display').innerHTML = number + '-' + 'IS An EVEN NUMBER';
    }  else{
      document.getElementById('display').innerHTML = number + '-' + 'IS An  ODD NUMBER';
    }
      }
      
  </script>
</html>
