<!DOCTYPE html>
<html>
  <head>
    <title>practice</title>
    <style>
    body{
      background-color: #eeeeee;
    }
        
    .container{
      background-color: white;
      box-shadow: 2px 4px 9px gray;
      padding: 10px;
      height: 300px;
      border-radius: 20px;
      margin-top: 150px;
    }
       
    .input-container{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    input{
      padding: 16px;
      width: 320px;
      box-shadow: 0px 3px 8px gray;
      border: none;
      border-radius: 20px;
      margin-top: 45px;
      box-sizing: border-box;
    }

    button{
     padding: 10px 30px;
     background-color: green;
     border: none;
     border-radius: 8px;
     color: white;
      font-size: 16px;
      outline: none;
      cursor: pointer;
      }
    
      input:hover{
       outline: 1px solid #4facfe;
      }
      
      h2{
        text-align: center;
        font-size: 25px;
        font-family: Times New Roman;
        color:#000000 ;
      }
    
      #display{
        font-size: 18px;
        text-align: center;
        color: #1a0492;
        font-weight: bold;
      }
      
      
    </style>
  </head>
  <body>
    <div class="container">
   <h2>Check All ODD And EVEN Numbers</h2>
   <div class="input-container">
   <input type="number" id="numberinput" placeholder="Enter a Number">
    <button onclick="btn()">Check</button>
    </div>
    <p id="display"></p>
      </div>
  </body>
  <script>
    
      function btn(){
        
    let number = document.getElementById('numberinput').value; 
    
    if ( number === '' ){
      document.getElementById('display').innerHTML =  'Please Enter a Number';
    } else if( number % 2 === 0){
      document.getElementById('display').innerHTML = number + '-' + 'IS AN EVEN NUMBER';
    }  else{
      document.getElementById('display').innerHTML = number + '-' + 'IS AN  ODD NUMBER';
    }
      }
      
  </script>
</html>
